[package]
name = "avdp-consulta"
version = "1.0.0"
description = "Consulta das Mensagens do AVDP Busca para o módulo do Holyrics"
authors = ["Isaac"]
edition = "2024"
rust-version = "1.90"
publish = false

# Pacote separado do app (src-tauri): não entra no `tauri build`.
# A busca, os grupos de mensagens e o banco vêm do próprio código do AVDP (`#[path]` em main.rs).

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust-stemmers = "1.2.0"
strsim = "0.11.1"
regex = "1.13.1"
unicode-normalization = "0.1.25"
once_cell = "1.21.4"
thiserror = "2.0.21"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# SQLite otimizado mesmo nos testes
[profile.dev.package."*"]
opt-level = 2
