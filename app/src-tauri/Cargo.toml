[package]
name = "avdp-busca"
version = "1.3.0"
description = "AVDP Busca"
authors = ["Isaac"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.4", features = ["protocol-asset"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-stemmers = "1.2.0"
strsim = "0.11.1"
regex = "1.13.1"
unicode-normalization = "0.1.25"
once_cell = "1.21.4"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
tauri-plugin-dialog = "2.8.3"
sha2 = "0.11.1"
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }

# SQLite e dependÃªncias otimizados mesmo no modo de desenvolvimento
[profile.dev.package."*"]
opt-level = 2
